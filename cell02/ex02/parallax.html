<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallax Effect</title>
    <link rel="stylesheet" href="parallax.css">
</head>
<body>

    <!-- 1: ภาพแรก + ข้อความกลางจอ -->
    <div class="parallax img1">
        <div class="caption">
            <span class="border">FIRST SECTION</span>
        </div>
    </div>

    <!-- 2:บล็อกสีดำตรงกลาง -->
    <div class="section-black">
        <h3>PARALLAX SECTION</h3>
        <p>This is a cat and dog</p>
    </div>

   <!-- 3: ภาพที่สอง + ข้อความกลางจอ  -->
    <div class="parallax img2">
        <div class="caption">
            <span class="border">SECOND SECTION</span>
        </div>
    </div>

</body>
</html>
