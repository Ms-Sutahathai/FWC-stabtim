<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile Card</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>

    <div class="card">
        <h2>User Profile Card</h2>
        
        <!-- ใช้ตารางล่องหนในการจัดโครงสร้างข้อมูล -->
        <table class="profile-table">
            <tr>
                <td>
                    <img class="profile-pic" src="https://t3.ftcdn.net/jpg/09/09/11/10/360_F_909111022_5zQGE6DHPqglss1so5IpJQqoQ0Pr38mC.jpg" alt="Profile Picture">
                </td>
            </tr>
            <tr>
                <td class="login-name">pesriton</td>
            </tr>
            <tr>
                <td class="description">42 Student Developer</td>
            </tr>
            <tr>
                <td>
                    <div class="social-icons">
                        <img src="https://cdn-icons-png.flaticon.com/512/25/25231.png" alt="GitHub">
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTPrKZM6lvjMDDgqm1qUjHf2KbodRWUZErY30B0T-qV6Q&s=10" alt="instagram">
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQHoOtZKjYkXr-sDUP7jR7vSqcZ-vQmJXFc82hcd9F1UQ&s=10" alt="X">
                    </div>
                </td>
            </tr>
            <tr>
                <td>
                    <button class="contact-btn">Contact</button>
                </td>
            </tr>
        </table>
    </div>

</body>
</html>
