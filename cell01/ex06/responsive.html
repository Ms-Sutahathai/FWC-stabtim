<!DOCTYPE html>
<html>
<head>
    <title>Responsive</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
        }
        table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
        }
        td {
            padding: 20px;
            text-align: center;
            font-size: 20px;
        }
        .cell-1 {
            background-color: lightblue;
        }
        .cell-2 {
            background-color: lightgreen;
        }

       
        @media (max-width: 600px) {
            td {
                display: block;
                width: 100%;
                height: 50%;
                box-sizing: border-box;
            }
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td class="cell-1">First cell</td>
            <td class="cell-2">Second cell</td>
        </tr>
    </table>

</body>
</html>
